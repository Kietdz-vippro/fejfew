<style>
* { box-sizing: border-box; }

body {
    margin: 0;

.page {
    position: fixed;

.falling-message {

@keyframes swayText {

}

/* ẢNH RƠI VÀ LẮC LƯ */
.falling-photo {

               swayPhoto 3s ease-in-out infinite alternate;
}

.falling-photo img {
    display: block;
    width: 100%;

    border: 3px solid white;
    border-radius: 12px;

}

@keyframes fallingPhoto {

}

@keyframes swayPhoto {
    from { margin-left: -20px; rotate: -6deg; }
    to { margin-left: 20px; rotate: 6deg; }
}

/* TIM BAY */
.heart {
    position: fixed;

}

@keyframes heartFly {
    0% {
        transform: translateY(0) rotate(0deg) scale(0.7);
        opacity: 0;
    }
    10% { opacity: 1; }
    100% {
        transform: translateY(-115vh) rotate(360deg) scale(1.3);

    }
}

/* ÁNH SAO */
.sparkle {
    position: fixed;
    z-index: 1;
    color: white;
    pointer-events: none;
    text-shadow: 0 0 8px white, 0 0 15px #ff8ac5;
    animation: sparkle 2s ease-in-out infinite alternate;
}

@keyframes sparkle {

}

/* PHÁO HOA */
.rocket {
    position: fixed;
    z-index: 4;
    width: 5px;
    height: 12px;
    border-radius: 50%;
    background: #fff4bd;
    box-shadow: 0 0 10px #fff, 0 0 20px #ff80c0;

}

.firework-particle {
    position: fixed;
    z-index: 4;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 8px currentColor;
}

/* ẢNH CHUYỂN TRANG */
#cloudTransition {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(5, 1fr);
    pointer-events: none;
    overflow: hidden;
}

#cloudTransition.active {
    display: grid;
}

.transition-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transform: scale(0);
}

#cloudTransition.cover .transition-image {
    animation: imageCover 0.8s ease-in forwards;
    animation-delay: var(--delay);
}

#cloudTransition.shrink .transition-image {
    animation: imageShrink 0.9s ease-out forwards;
    animation-delay: var(--delay);
}

@keyframes imageCover {
    from {
        opacity: 0;
        transform: scale(0) rotate(-15deg);
    }
    to {
        opacity: 1;
        transform: scale(1.5) rotate(0deg);
    }
}

@keyframes imageShrink {
    from {
        opacity: 1;
        transform: scale(1.5);
    }
    to {
        opacity: 0;
        transform: scale(0) rotate(15deg);
    }
}

@media (max-width: 600px) {
    .falling-message { font-size: 14px; }
    .main-button { font-size: 16px; }
}
</style>
</head>

<script>
const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");
const nextButton = document.getElementById("nextButton");
const cloudTransition = document.getElementById("cloudTransition");

let transitioning = false;
let youtubePlayer = null;
let youtubeReady = false;
let musicRequested = false;

/* NHẠC YOUTUBE */
const VIDEO_ID = "U4tOd6KBRwY";

/* TẠO TRÌNH PHÁT YOUTUBE */
function onYouTubeIframeAPIReady() {
    youtubePlayer = new YT.Player("youtubePlayer", {
        width: "200",
        height: "200",
        videoId: VIDEO_ID,
        playerVars: {
            autoplay: 0,
            controls: 0,
            loop: 1,
            playlist: VIDEO_ID,
            playsinline: 1,
            rel: 0
        },
        events: {
            onReady: function(event) {
                youtubeReady = true;
                event.target.setVolume(70);

                // Chỉ phát nếu người dùng đã bấm nút
                if (musicRequested) {
                    event.target.playVideo();
                }
            },
            onStateChange: function(event) {
                // Phát lại khi bài hát kết thúc
                if (event.data === YT.PlayerState.ENDED && musicRequested) {
                    event.target.playVideo();
                }
            }
        }
    });
}

/* TẢI API YOUTUBE */
(function() {
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
})();

/* BẤM NÚT: PHÁT NHẠC VÀ CHUYỂN TRANG */
nextButton.addEventListener("click", function() {
    if (transitioning) return;

    // Đánh dấu người dùng đã yêu cầu phát nhạc
    musicRequested = true;

    // Phát nhạc ngay trong thao tác bấm nút
    if (youtubeReady && youtubePlayer) {
        youtubePlayer.setVolume(70);
        youtubePlayer.playVideo();
    }

    transitioning = true;
    nextButton.disabled = true;

    cloudTransition.innerHTML = "";

    for (let i = 0; i < 30; i++) {
        const img = document.createElement("img");

        img.src = "anh.jpg";
        img.className = "transition-image";
        img.alt = "";

        img.style.setProperty(
            "--delay",
            (Math.random() * 0.3) + "s"
        );

        cloudTransition.appendChild(img);
    }

    cloudTransition.classList.add("active", "cover");

    setTimeout(function() {
        page2.style.visibility = "visible";
        page2.style.zIndex = "3";
    }, 850);

    setTimeout(function() {
        cloudTransition.classList.remove("cover");
        cloudTransition.classList.add("shrink");
    }, 1100);

    setTimeout(function() {
        page1.style.display = "none";
        page2.style.zIndex = "2";

        cloudTransition.classList.remove("active", "shrink");
        cloudTransition.innerHTML = "";
    }, 2100);
});

/* TIM BAY */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";

    const hearts = ["♥", "♡", "💗", "💕"];
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 25) + "px";

    const duration = 5 + Math.random() * 5;
    heart.style.animationDuration = duration + "s";

    document.body.appendChild(heart);

    setTimeout(function() {
        heart.remove();
    }, duration * 1000);
}

setInterval(createHeart, 700);

/* ÁNH SAO */
function createSparkle() {
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";
    sparkle.textContent = "✦";

    sparkle.style.left = Math.random() * 100 + "vw";
    sparkle.style.top = Math.random() * 100 + "vh";
    sparkle.style.fontSize = (8 + Math.random() * 15) + "px";
    sparkle.style.animationDelay = Math.random() * 2 + "s";

    document.body.appendChild(sparkle);

    setTimeout(function() {
        sparkle.remove();
    }, 5000);
}

setInterval(createSparkle, 400);

/* PHÁO HOA */
function launchFirework() {
    const x = 10 + Math.random() * 80;
    const startY = window.innerHeight + 10;
    const endY = window.innerHeight * (0.15 + Math.random() * 0.35);

    const rocket = document.createElement("div");
    rocket.className = "rocket";
    rocket.style.left = x + "vw";
    rocket.style.top = startY + "px";

    document.body.appendChild(rocket);

    const travelTime = 700 + Math.random() * 500;
    const startTime = performance.now();

    function moveRocket(now) {
        const progress = Math.min((now - startTime) / travelTime, 1);
        const currentY = startY + (endY - startY) * progress;

        rocket.style.top = currentY + "px";

        if (progress < 1) {
            requestAnimationFrame(moveRocket);
        } else {
            rocket.remove();
            explode(x * window.innerWidth / 100, endY);
        }
    }

    requestAnimationFrame(moveRocket);
}

function explode(x, y) {
    const colors = ["#ff4fa3", "#ffd166", "#ffffff", "#a78bfa", "#7df9ff"];

    for (let i = 0; i < 35; i++) {
        const particle = document.createElement("div");
        particle.className = "firework-particle";

        const color = colors[Math.floor(Math.random() * colors.length)];

        particle.style.background = color;
        particle.style.color = color;
        particle.style.left = x + "px";
        particle.style.top = y + "px";

        document.body.appendChild(particle);

        const angle = Math.PI * 2 * i / 35;
        const speed = 50 + Math.random() * 130;
        const dx = Math.cos(angle) * speed;
        const dy = Math.sin(angle) * speed;

        const animation = particle.animate([
            {
                transform: "translate(0, 0) scale(1)",
                opacity: 1
            },
            {
                transform: `translate(${dx}px, ${dy}px) scale(0.2)`,
                opacity: 0
            }
        ], {
            duration: 800 + Math.random() * 500,
            easing: "ease-out"
        });

        animation.onfinish = function() {
            particle.remove();
        };
    }
}

setInterval(launchFirework, 1500);
</script>

</body>
